// ============================================================================
// thisissparta2.cfg — the thisissparta2! MinstaHook server configuration.
//
// Fidelity rule (see DESIGN.md §3): this file changes NOTHING but stock
// cvars. No QuakeC patch is needed for MinstaHook — the game shipped both
// mutators; every line below names its source (the stock 2.5.2 server.cfg
// shipped in the release's server/ folder, or the 2.5.2 QuakeC sources).
// ============================================================================

// --- identity -------------------------------------------------------------
hostname "haxiuz"                   // the room's ONLY hosted name
                                    // (Chase, 2026-10-25; the [NNN] house
                                    // style of the original sparta rooms)
sv_public 0                         // LOCAL/BUNDLE default: do not announce.
                                    // A public launch sets sv_public 1
                                    // (DESIGN.md §7) — stock cvar, server.cfg:12
port 26000                          // stock default port, server.cfg:17
maxplayers 16                       // stock example value, server.cfg:16

// --- the game: Minsta + Hook instagib capture the flag ----------------------
g_ctf 1                             // the match is always CTF. The logic picks
                                    // its gametype from these per-mode cvars —
                                    // first set wins, else DM (qcsrc/server/
                                    // teamplay.qc, ReadGameCvars). There is no
                                    // working "gametype" switch; an earlier cut
                                    // of this file carried one and the room
                                    // silently stayed DM. Convicted 2026-10-25.
g_minstagib 1                       // MinstaGib: one-shot MinstaNex for all,
                                    // plus the minsta powerups. server.cfg:57
                                    // ("set to 1 for MinstaGib"); implemented
                                    // by WEP_MINSTANEX in the stock logic
                                    // (qcsrc/server/t_items.qc, g_damage.qc).
g_grappling_hook 1                  // the offhand grappling hook.
                                    // server.cfg:50 ("set to 1 to enable the
                                    // hook"); implemented in qcsrc g_hook.qc.
g_start_delay 10                    // every match opens with a 10-second
                                    // countdown (Chase, 2026-10-25): stock
                                    // machinery holds all weapons until
                                    // game_starttime (server/miscfunctions.qc
                                    // sets it from this cvar at map init;
                                    // server/cl_weapons.qc gates firing on
                                    // it) and the client centerprints the
                                    // count. The voice is house QC patch
                                    // #007 (sparta-csprogs.pk3): stock
                                    // client QC only speaks the numbers at
                                    // <= 3; the patch speaks 10..1, and the
                                    // stock BEGIN plays at zero.
// Everything else about the weapon/physics balance stays at the stock
// 2.5.2 defaults compiled into the logic (balance25.cfg / physics25.cfg,
// exec'd by the logic itself at boot). No balance cvar is touched here.

// --- maps -------------------------------------------------------------------
// Rotation (Chase, 2026-10-25): evilspace plus every CTF-capable space map
// in the candidate haul, plus dusty_v2 by his ruling. evilspace is the house
// CTF build (build/sparta-evilspace.pk3: stock geometry untouched;
// item_flag_team1/2 + info_player_team1/2 entities injected into the BSP
// entity lump; mapinfo gains "type ctf 300 20 10"). The rest are community
// pk3s with native flags + team spawns, served from data/ alongside stock.
// (ngstation joined the list a few hours later — its pk3 was recovered from
// the Wayback Machine after the live archive's copy died; same CTF proof.)
// Space maps with no flags (vegaspace, dm_spacestation, space-fun,
// spacecross_b1, nr_grid_in_space_v1r1, stock soylent/starship/skyway) stay
// out: they cannot run CTF without entity surgery.
// NARROWED (Chase, 2026-10-26): "Just evil space for now." The room
// runs evilspace alone — one arena, no rotation, no map downloads
// beyond the one house pack a joining client already needs. The
// twelve-map rotation above stands in git history when he reopens
// it; mostrecent exclusion is off so the single map repeats clean.
g_maplist "evilspace"
g_maplist_shuffle 1                 // random order, server.cfg:22
g_maplist_mostrecent_count 0        // was 3 (server.cfg:23): with a
                                    // one-map list there is no recent
                                    // to exclude.
g_maplist_check_waypoints 0         // was 1 (server.cfg:76): only
                                    // facing_worlds_nex2 and
                                    // interspacestation10 ship waypoints, so
                                    // checking would silently skip 8 of the
                                    // 10 added maps whenever bots fill.
                                    // Bots roam waypoint-less maps instead.
g_maplist_votable 0                 // rotation is the service's decision
                                    // (the dynamic mirror); the stock
                                    // default of 6 belongs to the client era.

// --- bots: the game's own havocbots, filled to a population -----------------
bot_join_empty 1                    // bots play on an empty server;
                                    // without this the stock logic only adds
                                    // bots once a human is present
                                    // (qcsrc/server/bot/bot.qc:536).
bot_number 0                        // no fixed bot squad…
minplayers 6                        // …the room is FILLED to 6 players by
                                    // bots instead (server.cfg:73). The
                                    // Director (smart/director.py) adapts
                                    // this number at runtime — that is the
                                    // smart layer acting on the real server
                                    // through its own console, not a logic edit.
bot_prefix "[BOT]"                  // stock default (server.cfg:74): bots are
                                    // honestly labelled, never disguised.
// BOTS ARE OPTIONAL (Chase, 2026-10-25): the room runs human-only with
// minplayers 0 + bot_join_empty 0 — proven on the Mac room in both
// directions (0 players / 0 joins human-only; filled room on the normal
// launch). The switch is these values at launch; a no-restart live flip
// needs a secure-rcon (srcon HMAC-MD4) client — this engine drops plain
// rcon whenever rcon_secure > 0 (netconn.c), and none is built yet.
// Default state: ON (fill to 6) until Chase rules otherwise; other human
// players are the expected population, bots are filler you can switch off.
skill 5                             // stock mid-high bot skill baseline;
                                    // the Director may grade it (DESIGN.md §6).

// --- observation seam ---------------------------------------------------------
sv_eventlog 1                       // the logic's own structured event log
                                    // (:join:/:part:/:kill:/:gamestart:) —
                                    // stock cvar (qcsrc miscfunctions.qc,
                                    // g_damage.qc LogDeath). The smart layer
                                    // reads the game through this, exactly as
                                    // the period rcon2irc tool did.

// frag/timelimits: deliberately NOT overridden — the map's .mapinfo limits
// rule (evilspace CTF: 300 points / 20 min, from the stock CTF map accident).

sv_eventlog_console 1  // event log to console, where the Director reads it (miscfunctions.qc GameLogEcho)

// --- the house character (Chase, 2026-10-25) --------------------------------
// Every player wears the same character by default: Mulder — "Nexuiz's
// Soldier" (mesh models/player/nexus.zym, skin 1; models/player/mulder.txt).
// Stock mechanism, no QC patch: sv_defaultcharacter switches on the default-
// character branch of FixPlayermodel (qcsrc/server/cl_client.qc), which
// forces model + skin on every client — bots included — and the per-team
// lines pin the same character for CTF. Team colors stay the stock team's
// own work (teamplay.qc setcolor on team join): red team red, blue team blue.
sv_defaultcharacter 1
sv_defaultplayermodel "models/player/nexus.zym"
sv_defaultplayerskin 1
sv_defaultplayermodel_red "models/player/nexus.zym"
sv_defaultplayerskin_red 1
sv_defaultplayermodel_blue "models/player/nexus.zym"
sv_defaultplayerskin_blue 1

// --- downloads and connection patience (2026-10-25) ---------------------------
// Ruled by Chase ("make the best decision") — all three of the web
// caching audit's recommendations applied. Web joiners reach this
// room over the bridge; their downloads and silence budgets are
// engine defaults until this section speaks.
net_messagetimeout 900              // seconds of client silence before
                                    // the server drops the client.
                                    // Engine default 300: a web client
                                    // mid-download, its acks riding its
                                    // frame loop, was dropped at 300 s
                                    // during the 2026-10-25 public
                                    // proof ("Player dropped
                                    // (Timed out)" in this server's
                                    // own log).
sv_allowdownloads_archive 1         // let joining clients download the
                                    // map packs themselves; engine
                                    // default 0 refuses them, and the
                                    // playlist lives in packs.
sv_allowdownloads_inarchive 1       // ...and the files inside those
                                    // packs; engine default 0.
